name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        run: npm run build --if-present
      - name: Run tests
        run: npm test

  docker-deploy:
    name: Docker Build and Compose Deploy
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker compose build
      - name: Deploy with Docker Compose
        run: docker compose up -d
      - name: Wait for health check and smoke test
        run: |
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8080/health && break
            sleep 2
          done
          curl -fsS http://localhost:8080/ | grep -q "ShopEasy"
          echo "Smoke test passed"
          docker compose ps
      - name: Show container logs
        if: always()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down

  monitoring-stack:
    name: Deploy with Monitoring (Prometheus + Grafana)
    needs: docker-deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start app and monitoring stack
        run: docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d --build
      - name: Generate traffic
        run: |
          for i in $(seq 1 20); do
            curl -fs http://localhost:8080/health >/dev/null && break
            sleep 2
          done
          for i in $(seq 1 50); do curl -fs http://localhost:8080/ >/dev/null; done
          echo "Sent 50 requests"
      - name: Verify Prometheus is scraping nginx
        run: |
          v=""
          for i in $(seq 1 30); do
            v=$(curl -s 'http://localhost:9090/api/v1/query?query=nginx_up' | jq -r '.data.result[0].value[1] // empty' || true)
            [ "$v" = "1" ] && echo "nginx_up=1 (Prometheus is scraping nginx)" && break
            sleep 3
          done
          [ "$v" = "1" ]
      - name: Verify Grafana is healthy
        run: |
          for i in $(seq 1 20); do
            curl -fsS http://localhost:3000/api/health && break
            sleep 3
          done
          curl -fsS http://localhost:3000/api/health | grep -q '"database": "ok"'
      - name: Show container status
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.monitoring.yml ps
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.monitoring.yml down

