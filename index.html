<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopEasy | E-commerce</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <h1>ShopEasy</h1>
    <p>Simple online shopping demo</p>
  </header>
  <main>
    <section aria-labelledby="products-title">
      <h2 id="products-title">Products</h2>
      <div id="products" class="products"></div>
    </section>
    <section class="cart" aria-labelledby="cart-title">
      <h2 id="cart-title">Shopping Cart (<span id="cart-count">0</span>)</h2>
      <ul id="cart-items"></ul>
      <p class="total">Total: ₹<span id="cart-total">0.00</span></p>
      <button id="checkout-button" type="button">Place order</button>
      <p id="message" role="status" aria-live="polite"></p>
    </section>
  </main>
  <footer><p>Assignment demo — Git, GitHub and CI/CD</p></footer>
</body>
</html>
